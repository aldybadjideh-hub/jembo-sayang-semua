<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jembo 🤍</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at 50% 40%, #24345f 0%, #10172e 40%, #050812 100%);
    color:white;
}

/* BINTANG */
.stars{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.7;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2; transform:scale(.7);}
    to{opacity:1; transform:scale(1.5);}
}

/* HALAMAN AWAL */
#awal{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:1s;
}

.small-text{
    font-size:13px;
    letter-spacing:4px;
    opacity:.65;
    margin-bottom:25px;
}

.btn{
    position:relative;
    padding:17px 45px;
    border-radius:50px;
    border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.08);
    color:white;
    font-size:17px;
    letter-spacing:2px;
    cursor:pointer;
    backdrop-filter:blur(12px);
    box-shadow:
        0 0 20px rgba(255,255,255,.12),
        inset 0 0 15px rgba(255,255,255,.05);
    transition:.3s;
    animation:pulse 2s infinite;
}

.btn:active{
    transform:scale(.92);
}

@keyframes pulse{
    0%,100%{
        box-shadow:0 0 15px rgba(255,255,255,.12);
    }
    50%{
        box-shadow:0 0 30px rgba(255,255,255,.3);
    }
}

/* HALAMAN UTAMA */
#utama{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:25px;
}

.icon{
    font-size:65px;
    margin-bottom:25px;
    animation:float 3s ease-in-out infinite;
    filter:drop-shadow(0 0 15px rgba(255,255,255,.4));
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

.judul{
    font-size:34px;
    font-weight:bold;
    letter-spacing:1px;
    opacity:0;
    transform:translateY(25px);
}

.judul.show{
    animation:appear 1.2s forwards;
}

.subjudul{
    margin-top:15px;
    font-size:16px;
    color:rgba(255,255,255,.65);
    letter-spacing:1px;
    opacity:0;
}

.subjudul.show{
    animation:appear 1s .5s forwards;
}

@keyframes appear{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.tap{
    margin-top:55px;
    font-size:14px;
    color:rgba(255,255,255,.8);
    letter-spacing:2px;
    animation:tapPulse 2s infinite;
}

.tap span{
    display:block;
    margin-top:8px;
    font-size:12px;
    opacity:.5;
}

@keyframes tapPulse{
    0%,100%{opacity:.5;}
    50%{opacity:1;}
}

/* LINGKARAN CAHAYA */
.glow{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(255,255,255,.04);
    box-shadow:
        0 0 100px rgba(120,160,255,.12),
        inset 0 0 80px rgba(255,255,255,.03);
    z-index:-1;
}

/* HATI */
.heart{
    position:absolute;
    font-size:25px;
    pointer-events:none;
    animation:heartFly 2s ease-out forwards;
    filter:drop-shadow(0 0 8px rgba(255,255,255,.7));
}

@keyframes heartFly{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.3) rotate(0deg);
    }
    15%{
        opacity:1;
        transform:translate(-50%,-60%) scale(1.2) rotate(-10deg);
    }
    100%{
        opacity:0;
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% - 220px)
            )
            scale(.6)
            rotate(var(--rotate));
    }
}

/* EFEK TAP */
.ripple{
    position:absolute;
    border:2px solid rgba(255,255,255,.5);
    border-radius:50%;
    pointer-events:none;
    animation:ripple .7s ease-out forwards;
}

@keyframes ripple{
    from{
        width:0;
        height:0;
        opacity:1;
    }
    to{
        width:100px;
        height:100px;
        margin-left:-50px;
        margin-top:-50px;
        opacity:0;
    }
}
</style>
</head>

<body>

<!-- BINTANG -->
<div class="stars" id="stars"></div>

<!-- HALAMAN AWAL -->
<div id="awal">

    <div class="small-text">
        ADA PESAN KECIL UNTUK JEMBO
    </div>

    <button class="btn" onclick="mulai()">
        Klik di sini ✨
    </button>

</div>


<!-- HALAMAN UTAMA -->
<div id="utama">

    <div class="glow"></div>

    <div class="icon">
        🤍
    </div>

    <div class="judul" id="judul">
        Jembo, ingat ibadah
    </div>

    <div class="subjudul" id="subjudul">
        Jangan lupa luangkan waktu untuk Tuhan.
    </div>

    <div class="tap">
        TAP-TAP AGAR JEMBO RAJIN IBADAH
        <span>🤍 setiap tap adalah pengingat kecil 🤍</span>
    </div>

</div>


<script>

/* MEMBUAT BINTANG */
const stars = document.getElementById("stars");

for(let i=0;i<70;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    star.style.animationDelay=(Math.random()*3)+"s";

    const size=Math.random()*3+1;

    star.style.width=size+"px";
    star.style.height=size+"px";

    stars.appendChild(star);
}


/* MASUK KE HALAMAN UTAMA */
function mulai(){

    const awal=document.getElementById("awal");
    const utama=document.getElementById("utama");

    awal.style.opacity="0";

    setTimeout(()=>{

        awal.style.display="none";

        utama.style.display="flex";

        setTimeout(()=>{
            document.getElementById("judul")
            .classList.add("show");

            document.getElementById("subjudul")
            .classList.add("show");

        },100);

    },800);
}


/* TAP DI MANA SAJA */
document.addEventListener("click",function(e){

    const utama=document.getElementById("utama");

    if(utama.style.display !== "flex") return;

    /* RIPPLE */
    const ripple=document.createElement("div");

    ripple.className="ripple";

    ripple.style.left=e.clientX+"px";
    ripple.style.top=e.clientY+"px";

    document.body.appendChild(ripple);

    setTimeout(()=>{
        ripple.remove();
    },700);


    /* HATI */
    for(let i=0;i<3;i++){

        setTimeout(()=>{

            const heart=document.createElement("div");

            heart.className="heart";
            heart.innerHTML="🤍";

            heart.style.left=e.clientX+"px";
            heart.style.top=e.clientY+"px";

            heart.style.setProperty(
                "--x",
                ((Math.random()-0.5)*180)+"px"
            );

            heart.style.setProperty(
                "--rotate",
                ((Math.random()-0.5)*50)+"deg"
            );

            heart.style.fontSize=
                (18+Math.random()*20)+"px";

            document.body.appendChild(heart);

            setTimeout(()=>{
                heart.remove();
            },2000);

        },i*120);
    }

});

</script>

</body>
</html>
